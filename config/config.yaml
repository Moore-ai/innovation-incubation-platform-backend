server:
  port: ${SERVER_PORT}
  mode: ${SERVER_MODE}
  rbac_enabled: true

db:
  host: ${DB_HOST}
  port: ${DB_PORT}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  name: ${DB_NAME}
  sslmode: disable
  log_level: WARN    # INFO | WARN

jwt:
  secret: ${JWT_SECRET}
  expire_hours: 24

ai:
  openai:
    api_key: ${AI_API_KEY}
    base_url: ${AI_BASE_URL}
    model: ${AI_MODEL}
    timeout_seconds: 30
  embedding:
    api_key: ${EMBEDDING_API_KEY}
    base_url: ${EMBEDDING_BASE_URL}
    model: ${EMBEDDING_MODEL}
    dimensions: 1024
    timeout_seconds: 30
  use_legal_raw_for_summary: true
  use_legal_raw_for_embedding: false

filematch:
  weight_jaro: 0.4
  weight_keyword: 0.4
  weight_prefix: 0.2
  threshold: 0.6
  stop_words:
    - 复印件
    - 原件
    - 扫描件
    - 照片
    - 图片
    - 副本
    - 电子版
    - 扫描

search:
  method: vector      # structured | vector
  max_results: 10
  vector:
    dimensions: 1024
    top_k: 8
    min_score: 0.3
    rerank: true
    mqe:
      enabled: false
      n_queries: 3
      rrf_k: 60
    hyde:
      enabled: false
      max_tokens: 512

redis:
  addr: ${REDIS_ADDR}
  password: ""
  db: ${REDIS_DB}

upload:
  max_size_mb: 20
  file_dir: uploads
  allowed_extensions: [".docx", ".pdf", ".xlsx", ".txt"]

rate_limit:
  enabled: true
  algorithm: token_bucket
  default_rpm: 60
  whitelist: []

log:
  enabled: false

notification:
  heartbeat_seconds: 30
  recent_count: 20
  max_conns_per_user: 10

file_parser:
  enabled: true
  venv_path: "sidecar/file-parser/venv"
  script_path: "sidecar/file-parser/server.py"
  timeout_sec: 30

report_converter:
  venv_path: "sidecar/report-converter/venv"
  port: 9800
  timeout_sec: 60

agent:
  model: ""               # 空字符串表示沿用 ai.openai.model
  max_steps: 10
  message_max_chars: 2000
  request_timeout_sec: 120
  planning_enabled: false
  planning_model: ""
  public_sse_types: [reply, done, thinking, error, tool_result, report_start, report_progress, report_done]  # 允许暴露给前端的 SSE 事件
  context_window: 512000
  history_budget_ratio: 0.7
  token_estimation: better     # simple | better
  working_memory:
    page_size: 10
  memory:
    semantic_limit: 3
    episodic_limit: 3
    episodic_decay_factor: 0.95   # 情景记忆每个月的保存能力
    hyde_max_tokens: 256          # HyDE 文档生成最大 token 数
